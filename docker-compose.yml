services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gmailstory
      POSTGRES_PASSWORD: gmailstory_dev
      POSTGRES_DB: gmailstory
    # Host port (first number): change if you see "Bind for 0.0.0.0:… failed: port is already allocated"
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gmailstory -d gmailstory"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
